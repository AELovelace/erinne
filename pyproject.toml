[project]
name = "mnemerynne"
version = "0.1.0"
description = "Private document inbox and cited Q&A assistant"
requires-python = ">=3.14"
# Exact pins: unpinned installs once pulled a breaking Starlette release into
# production. Upgrade deliberately and re-run the test suite.
dependencies = [
    "fastapi==0.156.1",
    "starlette==1.9.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "httpx==0.28.1",
    "passlib==1.7.4",
    "pydantic-settings==2.16.1",
    "sqlite-vec==0.1.9",
    "pypdfium2==5.14.0",
    "markdown-it-py==4.2.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "numpy==2.5.4",
    "mcp==2.3.0",
    "pillow==13.0.0",
    # Word, PowerPoint, Excel and RTF readers (mnemerynne/ingest/documents.py)
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "striprtf==0.0.34",
]

[dependency-groups]
dev = [
    "pytest==9.1.0",
]

[project.scripts]
mnemerynne = "mnemerynne.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
