[project]
name = "erinne"
version = "0.1.0"
description = "Private document inbox and cited Q&A assistant"
requires-python = ">=3.14"
# Exact pins: unpinned installs once pulled a breaking Starlette release into
# production. Upgrade deliberately and re-run the test suite.
dependencies = [
    "fastapi==0.156.1",
    "starlette==1.9.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "httpx==0.28.1",
    "passlib==1.7.4",
    "pydantic-settings==2.16.1",
    "sqlite-vec==0.1.9",
]

[dependency-groups]
dev = [
    "pytest==9.1.0",
]

[project.scripts]
erinne = "erinne.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
