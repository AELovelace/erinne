{% extends "base.html" %}
{% block title %}{{ file.display_name }} · {{ product_name }}{% endblock %}
{% block body %}
<header class="topbar doc-bar">
  <a class="brand" href="/"><span class="blossom" aria-hidden="true">🌸</span>{{ assistant_name }}</a>
  <strong>{{ file.display_name }}</strong>
  <span class="muted">{{ file.collection_name }}</span>
  <a class="push-right" href="/files/{{ file.id }}/raw">Download</a>
</header>
<main class="doc">
  {{ content | safe }}
</main>
{% endblock %}
