# The public landing page (deploy/landing/) on its own hostname: a static folder and nothing else.
# Goes to /etc/nginx/conf.d/mnemerynne-landing.conf, with landing.example.org replaced by the real hostname:
#   sed 's/landing.example.org/YOUR-LANDING-HOSTNAME/g' nginx-mnemerynne-landing.conf | sudo tee /etc/nginx/conf.d/mnemerynne-landing.conf
# There is deliberately no proxy_pass anywhere in this file: nothing here reaches the app, so there is no sign-in,
# no API and no /mcp on this name. Every path that isn't a file in the folder is a 404 (/login included).
# landing-install.sh copies the files to /var/www/mnemerynne-landing and gets the certificate (README).
# Take this hostname out of the edge file's server_name lines (nginx-mnemerynne-edge.conf) so the two never overlap.

server {                                              # port 80: Let's Encrypt's check, everything else to HTTPS
    listen 80;
    listen [::]:80;
    server_name landing.example.org;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;                    # the same webroot the edge uses
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name landing.example.org;
    ssl_certificate     /etc/letsencrypt/live/landing.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/landing.example.org/privkey.pem;
    server_tokens off;                                # no nginx version in errors or the Server header

    root /var/www/mnemerynne-landing;                 # index.html, landing.css, landing.js, favicon.svg, parallax/
    index index.html;
    client_max_body_size 1k;                          # nothing to upload here

    # Our own files only: no inline scripts, nothing from other sites, can't be framed.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_except GET { deny all; }                # read-only (GET includes HEAD): a POST is refused
        try_files $uri $uri/ =404;                    # a file in the folder, or 404: never anything else
    }
    location /parallax/ {
        limit_except GET { deny all; }
        expires 30d;                                  # the city art never changes between installs
        try_files $uri =404;
    }
}
