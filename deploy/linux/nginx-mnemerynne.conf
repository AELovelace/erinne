# /etc/nginx/conf.d/mnemerynne.conf
# LAN apps served through Mnemerynne (/remote/<slug>/...) use websockets: pass the upgrade on.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name erynne.example.internal;

    ssl_certificate     /etc/pki/tls/certs/mnemerynne.crt;
    ssl_certificate_key /etc/pki/tls/private/mnemerynne.key;

    # Uploads up to 500 MiB (MNEMERYNNE_MAX_FILE_BYTES) plus multipart overhead;
    # keep the two in step.
    client_max_body_size 510m;

    location / {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Answers stream as server-sent events: don't buffer them.
    location = /api/ask {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Rooms' live stream (server-sent events, one per open tab): unbuffered, and held open; the app
    # sends a heartbeat every 20 s, so a dead connection still closes.
    location = /api/rooms/stream {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # MCP endpoint for Claude Desktop (bearer tokens; see mnemerynne/mcp_server.py).
    location = /mcp {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Media (Settings → Entertainment → Media): films and music stream from here with Range requests, HLS segments
    # are fetched as ffmpeg writes them, and radio is relayed for as long as someone listens. Buffering
    # would copy whole films to nginx's temp folder first.
    location /media/ {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Remote apps (Access → Remote): long-lived connections, websockets, no buffering.
    location /remote/ {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

# Games (README 5l): the arcade, MNEMERYNNE_ARCADE_URL's host, with its own certificate. Same app, which
# sends this host to the arcade before any of Mnemerynne's pages run. Remove it if you don't use Games.
server {
    listen 443 ssl;
    server_name arcade.example.internal;

    ssl_certificate     /etc/pki/tls/certs/arcade.crt;
    ssl_certificate_key /etc/pki/tls/private/arcade.key;

    location / {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

# The backup host (README 5m), when the box runs nginx rather than Caddy. Only the reverse proxy at 10.1.1.20
# talks to it (nginx-bkp.conf there holds the public certificate); give this block a certificate from your
# internal CA, which the proxy trusts. The laptop's address comes from the proxy's X-Forwarded-For.
server {
    listen 443 ssl;
    server_name bkp.beepsquad.wtf;

    ssl_certificate     /etc/pki/tls/certs/bkp.crt;
    ssl_certificate_key /etc/pki/tls/private/bkp.key;

    set_real_ip_from 10.1.1.20;
    real_ip_header X-Forwarded-For;
    if ($realip_remote_addr != 10.1.1.20) {
        return 403;
    }
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
