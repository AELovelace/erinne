# ONLYOFFICE Docs behind the edge nginx (README "ONLYOFFICE").
# Installed by onlyoffice-setup.sh as /etc/nginx/mnemerynne-edge.d/onlyoffice.conf, which the edge
# (nginx-mnemerynne-edge.conf) includes inside its HTTPS server block, ahead of `location /`.
#
#   /onlyoffice/            browsers -> the container on 127.0.0.1:8090, signed-in people only (auth_request)
#   /onlyoffice/<admin>     healthcheck, info, ConvertService/CommandService, coauthoring/: the LAN only
#   /_office_auth           internal: asks the app "is this cookie signed in?" (204 yes, 401 no)
#   /api/office/ds/         the container fetching a file and posting its save callback: the podman subnet only
#
# The container reaches https://<host>/api/office/ds/ through this edge (AddHost=<host>:host-gateway in the
# quadlet), so those requests come from 10.88.0.0/16, podman's default bridge.

# --- ONLYOFFICE's admin and server-to-server paths: monitors and the box only, never the internet.
# A regex location, so it wins over the /onlyoffice/ prefix below.
location ~ ^/onlyoffice/(healthcheck|info(/|$)|coauthoring/|.*(ConvertService|CommandService)\.ashx) {
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;                                 # the LAN ranges, as for the edge's /healthz/full
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;                                         # from the internet: 403
    rewrite ^/onlyoffice/(.*)$ /$1 break;             # drop the /onlyoffice prefix (a regex location can't do it in proxy_pass)
    proxy_pass http://127.0.0.1:8090;                 # the container (PublishPort=127.0.0.1:8090:80)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host/onlyoffice;   # ONLYOFFICE builds its own links from this (virtual path)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# --- The editor itself: scripts, fonts, the websocket that carries co-editing. Signed-in people only.
location /onlyoffice/ {
    auth_request /_office_auth;                       # 2xx from the app lets it through; 401 stops it here
    proxy_pass http://127.0.0.1:8090/;                # trailing slash: /onlyoffice/x reaches the container as /x
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host/onlyoffice;   # ONLYOFFICE's virtual-path pattern: its links keep /onlyoffice/
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the person's address
    proxy_set_header X-Forwarded-Proto https;         # the browser is on HTTPS even though the container speaks HTTP
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;           # websockets (co-editing) pass through
    proxy_set_header Connection $edge_connection_upgrade;   # the edge's map: "upgrade" or "close"
    client_max_body_size 100m;                        # pasted images and uploads inside the editor
    proxy_read_timeout 3600s;                         # an editing session's websocket stays open for hours
    proxy_send_timeout 3600s;
}

# --- The sign-in check behind auth_request: the app's /api/office/ds-auth, through the front door like `location /`.
location = /_office_auth {
    internal;                                         # only auth_request can reach it; from a browser it's a 404
    proxy_pass http://127.0.0.1:38200/api/office/ds-auth;   # the front door, the same upstream `location /` uses
    proxy_pass_request_body off;                      # the check needs the cookie, never the body
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;             # the session cookie is what's checked
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;     # what was asked for, for the app's log
}

# --- The container's own calls into the app: download the file, post the save callback.
# Only from the podman subnet and the box; the app checks the JWT and the address as well.
location /api/office/ds/ {
    allow 10.88.0.0/16;                               # podman's default bridge: where the container's requests come from
    allow 127.0.0.1;
    allow ::1;
    deny all;                                         # anyone else: 403 before the app sees it
    proxy_pass http://127.0.0.1:38200;                # the front door, exactly as `location /`
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the container's address; the front door adds its own
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $edge_connection_upgrade;
    client_max_body_size 510m;                        # a saved document can be as large as any upload (the edge's limit)
    proxy_buffering off;                              # files stream out as they're read
    proxy_request_buffering off;                      # and a saved file streams in
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
