# nginx as this box's HTTPS edge, instead of Caddy (README "nginx holds HTTPS on this box").
# Goes to /etc/nginx/conf.d/mnemerynne-edge.conf, with mnemerynne.example.org replaced by the real hostname:
#   sed 's/mnemerynne.example.org/YOUR-HOSTNAME/g' nginx-mnemerynne-edge.conf | sudo tee /etc/nginx/conf.d/mnemerynne-edge.conf
# It holds 80 and 443 and sends everything to 127.0.0.1:38200, where front-door.sh's nginx (the same nginx, a second
# server block) splits the paths between the services. That file existing is what lets `front-door.sh on` keep
# the app on 127.0.0.1, and makes `front-door.sh off` leave nginx running.
# Certificates: certbot (webroot below), renewed by certbot-renew.timer, which reloads nginx (README).
# Extra paths only this box has (a webhook receiver, say) go in /etc/nginx/mnemerynne-edge.d/*.conf: they're
# included inside the HTTPS server block, ahead of the catch-all.

map $http_upgrade $edge_connection_upgrade {          # websockets (Remote, Rooms) pass through; plain requests close
    default upgrade;
    ''      close;
}

server {                                              # port 80: Let's Encrypt's check, everything else to HTTPS
    listen 80;
    listen [::]:80;
    server_name mnemerynne.example.org;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;            # certbot certonly --webroot -w /var/www/letsencrypt
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mnemerynne.example.org;
    ssl_certificate     /etc/letsencrypt/live/mnemerynne.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mnemerynne.example.org/privkey.pem;
    server_tokens off;                                # no nginx version in errors or the Server header
    client_max_body_size 510m;                        # the largest upload (Files); the front door allows any size

    include /etc/nginx/mnemerynne-edge.d/*.conf;      # this box's own extra paths, if any

    location / {
        proxy_pass http://127.0.0.1:38200;            # the front door
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the person's address; the front door adds its own
        proxy_set_header X-Forwarded-Proto $scheme;   # https: the front door passes it on as it came
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $edge_connection_upgrade;
        proxy_buffering off;                          # streamed answers, live events and films go out as they come
        proxy_request_buffering off;                  # uploads stream to the app instead of filling nginx's disk first
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
