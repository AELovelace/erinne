# The backup host on the reverse proxy (10.1.1.20), e.g. /etc/nginx/conf.d/bkp.beepsquad.wtf.conf.
# README section 5m. The desktop backup app sends files here from anywhere; this proxy hands them to the
# web server on Mnemerynne's box (its Caddy, or its nginx: Caddyfile-mnemerynne-backup / the bkp block
# in nginx-mnemerynne.conf), never straight to the app's port.
#
# Replace MNEMERYNNE-BOX with the box's address on the LAN, and copy the box web server's root certificate
# here (Caddy: /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt; nginx: your internal CA)
# as /etc/nginx/mnemerynne-box-ca.crt. Get the public certificate with:
#   sudo certbot --nginx -d bkp.beepsquad.wtf

# In http {} (e.g. /etc/nginx/conf.d/00-bkp-limits.conf): requests a second per client address.
limit_req_zone $binary_remote_addr zone=bkp:10m rate=50r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name bkp.beepsquad.wtf;
    ssl_certificate     /etc/letsencrypt/live/bkp.beepsquad.wtf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bkp.beepsquad.wtf/privkey.pem;

    # One part (32 MiB) or one small file per request, plus headroom. Bigger files come in parts.
    client_max_body_size 40m;

    location ~ ^/(api/sync/|oauth/(token|revoke)$) {
        proxy_pass https://MNEMERYNNE-BOX;
        proxy_ssl_server_name on;
        proxy_ssl_name bkp.beepsquad.wtf;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/mnemerynne-box-ca.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        # Stream bodies through instead of spooling each one to this proxy's disk first, and stream
        # downloads (Restore) back the same way.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 120s;
        limit_req zone=bkp burst=200 nodelay;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name bkp.beepsquad.wtf;
    return 301 https://$host$request_uri;
}
