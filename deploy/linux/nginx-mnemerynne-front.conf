# nginx as the box's front door, behind a reverse proxy that holds the certificates (here: site-chan, 10.1.1.20).
# /etc/nginx/conf.d/mnemerynne-front.conf. README: "nginx in front of the app processes".
#
# The reverse proxy keeps sending everything to this box's MNEMERYNNE port (38200 below), so neither it nor the
# firewall between them changes. nginx hands each path to the process that serves it, all on 127.0.0.1:
#   38210  the web app (everything else)              mnemerynne-web    (MNEMERYNNE_HOST=127.0.0.1, MNEMERYNNE_PORT=38210)
#   38201  the desktop backup app's API, /api/sync/    mnemerynne-sync   (three processes)
#   38202  the games' API, /api/media/games            mnemerynne-games
# Replace 192.168.1.5 with the box's LAN address (where the reverse proxy sends to).

# Websockets (Remote's LAN apps) pass their upgrade on.
map $http_upgrade $front_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mnemerynne_web   { server 127.0.0.1:38210; keepalive 32; }
upstream mnemerynne_sync  { server 127.0.0.1:38201; keepalive 16; }
upstream mnemerynne_games { server 127.0.0.1:38202; keepalive 16; }

server {
    listen 192.168.1.5:38200;
    server_name _;

    # The reverse proxy already limits sizes (uploads up to 60 GB to /api/files): don't add a second limit here.
    client_max_body_size 0;
    # Pass bodies and answers straight through: uploads, live streams, films with Range. Nothing is spooled here.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # What the reverse proxy said, passed on: the site's name, https (it ended TLS), and the client's address with
    # the reverse proxy's added after it. The app trusts this box and the reverse proxy (FORWARDED_ALLOW_IPS), so
    # it still sees each person's own address for login throttling and rate limits.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";              # keep the connections to the processes open between requests

    # The desktop backup app's API: its own processes.
    location /api/sync/ {
        proxy_pass http://mnemerynne_sync;
    }

    # The games' API (polls and their live streams): its own process.
    location /api/media/games {
        proxy_pass http://mnemerynne_games;
    }

    # Remote's LAN apps: websockets.
    location /remote/ {
        proxy_pass http://mnemerynne_web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $front_connection_upgrade;
    }

    # Everything else: the web app.
    location / {
        proxy_pass http://mnemerynne_web;
    }
}
