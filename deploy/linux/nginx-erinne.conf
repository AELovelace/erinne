# /etc/nginx/conf.d/erinne.conf
server {
    listen 443 ssl;
    server_name erinne.example.internal;

    ssl_certificate     /etc/pki/tls/certs/erinne.crt;
    ssl_certificate_key /etc/pki/tls/private/erinne.key;

    # PDFs up to 100 MB (ERINNE_MAX_PDF_BYTES) plus multipart overhead.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Answers stream as server-sent events: don't buffer them.
    location = /api/ask {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # MCP endpoint for Claude Desktop (bearer tokens; see erinne/mcp_server.py).
    location = /mcp {
        proxy_pass http://127.0.0.1:38200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
